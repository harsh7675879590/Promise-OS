<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <rect width="30" height="30" x="1" y="1" rx="6" fill="#131822" stroke="#1f293d" stroke-width="1"/>

  <!-- Dependency Graph Path: Node A (bottom-left) to Node B (top-right) with link -->
  <path d="M 9 22 C 9 14, 23 18, 23 10" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 9 22 C 9 15, 17 17, 19 13" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 2.5"/>

  <!-- Upstream Prerequisite Node (Harshit / Delivery) -->
  <circle cx="23" cy="10" r="4.5" fill="url(#pGrad)"/>
  <circle cx="23" cy="10" r="2" fill="#ffffff"/>

  <!-- Dependent / At-Risk Node (Client Deadline) -->
  <circle cx="9" cy="22" r="4.5" fill="url(#riskGrad)"/>
  <circle cx="9" cy="22" r="2" fill="#ffffff"/>
  
  <!-- Directional Flow Point -->
  <circle cx="16" cy="16" r="1.5" fill="#60a5fa"/>
</svg>
